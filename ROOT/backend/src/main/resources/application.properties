spring.application.name=backend

/***
 * edit the lines below to connect to your MySQL database. line 9 - 11
 * keep the datatabase name as "ProjectSQL". but chack to make sure the url is correct
 */


spring.datasource.url=jdbc:mysql://localhost:3306/ProjectSQL
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.open-in-view=false